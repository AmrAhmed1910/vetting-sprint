<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vetting Sprint</title>
<meta name="theme-color" content="#2F55D4">
<meta name="description" content="Amr's 30-day job-readiness sprint for micro1, Turing, Crossover and Arc.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sprint">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
/* Layout: one narrow column, sticky score strip with a locked level path, one level shown at a time */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --sunk:#E8ECF5; --line:#D5DBE8;
  --fg:#131A2C; --muted:#5A6480;
  --accent:#2F55D4; --accent-ink:#FFFFFF; --accent-soft:#DFE6FC;
  --good:#1F8A5B; --good-soft:#D8F1E5; --warn:#B26A00; --warn-soft:#FBEBCF; --hot:#C2410C;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1220; --surface:#161C2E; --sunk:#1D2438; --line:#2A3350;
  --fg:#E7EBF5; --muted:#98A2BE;
  --accent:#7D98FF; --accent-ink:#0E1220; --accent-soft:#232F57;
  --good:#4CC890; --good-soft:#163A2B; --warn:#F0B354; --warn-soft:#3A2C12; --hot:#FB8A55;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#161C2E; --sunk:#1D2438; --line:#2A3350;
  --fg:#E7EBF5; --muted:#98A2BE;
  --accent:#7D98FF; --accent-ink:#0E1220; --accent-soft:#232F57;
  --good:#4CC890; --good-soft:#163A2B; --warn:#F0B354; --warn-soft:#3A2C12; --hot:#FB8A55;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1rem;font-weight:600}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sync{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}

.score{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{display:block;font-family:var(--f-mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--sunk);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:999px;white-space:nowrap;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}

section.view{margin-top:16px;display:grid;gap:14px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px}
.week-tag{display:inline-block;font-family:var(--f-mono);font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-top:4px}
.flag{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:.9rem}
.flag strong{color:var(--warn)}
.block{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;align-items:start}
.block.done{border-color:var(--good);background:linear-gradient(0deg,var(--good-soft),var(--good-soft)) , var(--surface)}
.check{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:700;color:var(--accent-ink);flex:none}
.block.done .check{background:var(--good);border-color:var(--good)}
.block .meta{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.block p{margin:2px 0 0;min-width:0}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);padding:10px;font:inherit;resize:vertical}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--f-mono);font-size:.85rem;position:relative;padding:0;max-width:100%}
.cal button.p1{background:var(--accent-soft)}
.cal button.p3{background:var(--good);color:var(--accent-ink);border-color:var(--good)}
.cal button.today{outline:2px solid var(--fg);outline-offset:1px}
.cal button.ms::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--hot)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.list{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .name{min-width:0}
.row .name a{text-decoration:none;color:var(--fg);font-weight:500}
.row .name small{display:block;color:var(--muted);font-size:.75rem}
.grp{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 14px 4px;background:var(--sunk);border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 9px;font-size:.78rem;font-family:var(--f-mono);color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button.on.g{background:var(--good)}
.seg button.on.w{background:var(--warn);color:var(--accent-ink)}
.due{background:var(--warn-soft);border-radius:12px;padding:12px 14px}
.due ul{margin:6px 0 0;padding-left:18px}

.ms{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.ms .d{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);width:3.2em}
.pill{font-family:var(--f-mono);font-size:.7rem;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--good)}

.cheat{counter-reset:c;display:grid;gap:8px;margin:0;padding:0;list-style:none}
.cheat li{display:grid;grid-template-columns:2em 1fr;gap:8px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.cheat li::before{counter-increment:c;content:counter(c);font-family:var(--f-mono);color:var(--accent);font-weight:700}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.prompt code{font-family:var(--f-mono);font-size:.8rem;background:var(--sunk);padding:10px;border-radius:8px;white-space:pre-wrap;word-break:break-word;display:block}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;justify-self:start}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.settings{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.settings input{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 8px;font:inherit}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.zcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.zcard.result{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:7px 12px;font-weight:500}
.chip:hover{border-color:var(--accent)}
.chip .mono{color:var(--muted);font-size:.75rem;margin-left:4px}
.settings label{display:flex;gap:8px;align-items:center;font-size:.88rem}
.zhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.zhead>div{min-width:0}
.chat{display:grid;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.msg .who{display:block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.msg.zara{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;justify-self:start}
.msg.amr{background:var(--accent-soft);border-bottom-right-radius:4px;justify-self:end}
.msg.thinking{color:var(--muted);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.answer{display:grid;gap:8px}
.tline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tbar{margin-top:0}.tbar i{background:var(--warn)}
.zbtns{display:flex;flex-wrap:wrap;gap:8px}
.sc{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 8px;border-radius:999px;font-family:var(--f-mono);font-weight:700;font-size:.8rem}
.sc.big{font-size:.95rem;height:32px;padding:0 14px}
.sc.s0{background:var(--hot);color:var(--accent-ink)}
.sc.s1{background:var(--warn-soft);color:var(--warn)}
.sc.s2{background:var(--good-soft);color:var(--good)}
.zfocus{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.zfocus li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.zfocus small{display:block;color:var(--muted)}
.lvmap{display:flex;align-items:center;margin-top:12px;gap:0}
.lvline{flex:1;height:2px;background:var(--line);min-width:6px}
.lv{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;padding:0;flex:none}
.lvdot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.85rem;border:2px solid var(--line);background:var(--surface);color:var(--muted)}
.lvname{font-size:.7rem;font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
.lv.done .lvdot{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.lv.current .lvdot{border-color:var(--accent);color:var(--accent)}
.lv.locked{cursor:not-allowed}.lv.locked .lvdot{background:var(--sunk);opacity:.75}
.lv.sel .lvdot{box-shadow:0 0 0 3px var(--accent-soft)}
.lv.sel .lvname{color:var(--fg);font-weight:700}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dpill{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);display:grid;place-items:center;position:relative;padding:0}
.dpill.p1{background:var(--accent-soft)}
.dpill.p3{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.dpill.locked{background:var(--sunk);color:var(--muted);cursor:not-allowed}
.dpill.sel{outline:2px solid var(--fg);outline-offset:1px}
.dpill.gate::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--hot)}
.lockcard{display:flex;gap:12px;align-items:flex-start;border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--fg)}
.lockcard>svg{flex:none;margin-top:3px;color:var(--muted)}
.bbody{min-width:0;display:grid;gap:8px}
.plist{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.prow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .name{min-width:0}.prow .name a{text-decoration:none;color:var(--fg);font-weight:500}
.prow small{display:block;color:var(--muted);font-size:.72rem}
.skipnote{background:var(--good-soft);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:.85rem}
.pdet summary{cursor:pointer;font-size:.85rem;color:var(--accent);font-weight:500}
.pdet[open]{display:grid;gap:8px}
.pdet code{font-family:var(--f-mono);font-size:.78rem;background:var(--sunk);padding:10px;border-radius:8px;white-space:pre-wrap;word-break:break-word;display:block;margin-top:8px}
.keybox{display:grid;gap:8px;background:var(--sunk);border-radius:10px;padding:12px}
.foot{margin-top:28px;color:var(--muted);font-size:.85rem}.foot summary{cursor:pointer}
main.view{margin-top:16px;display:grid;gap:14px}
.rankbtn{text-align:left;font:inherit;color:inherit;cursor:pointer;display:block}
.rankbtn:hover{border-color:var(--accent)}
.rankbtn span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rankbar{display:block;height:3px;border-radius:2px;background:var(--sunk);margin-top:4px;overflow:hidden}
.rankbar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.flame{width:16px;height:16px;margin-left:4px;vertical-align:-1px;fill:var(--line)}
.flame.lit{fill:var(--hot)}
.xpfloat{position:fixed;z-index:30;pointer-events:none;font-family:var(--f-mono);font-weight:700;font-size:.9rem;color:var(--good);animation:xpup 1.1s ease-out forwards}
.xpfloat.neg{color:var(--muted)}
@keyframes xpup{0%{opacity:0;transform:translateY(6px) scale(.9)}15%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-46px) scale(1)}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.badgetoast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:35;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--warn);border-radius:14px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);max-width:calc(100% - 32px)}
.badgetoast.show{transform:translate(-50%,0)}
.badgetoast b{display:block}.badgetoast span{display:block;font-size:.8rem;color:var(--muted)}
.medal{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);flex:none}
.medal svg{width:20px;height:20px;fill:currentColor}
.overlay{position:fixed;inset:0;z-index:38;background:rgba(10,14,28,.55);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.ocard{background:var(--surface);color:var(--fg);border-radius:18px;padding:22px;display:grid;gap:12px;width:100%;max-width:420px;text-align:center;justify-items:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
.ocard h2{font-size:1.8rem}
.ocard.tall{max-width:560px;text-align:left;justify-items:stretch;max-height:100%;overflow:auto}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.tbody{display:grid;gap:10px}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ladder li{display:flex;justify-content:space-between;padding:6px 10px;border-radius:8px;color:var(--muted)}
.ladder li.past{color:var(--fg)}
.ladder li.now{background:var(--accent);color:var(--accent-ink);font-weight:600}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:4px;justify-items:start;opacity:.55}
.badge .medal{background:var(--sunk);color:var(--muted)}
.badge.got{opacity:1;border-color:var(--warn)}
.badge.got .medal{background:var(--warn-soft);color:var(--warn)}
.badge small{color:var(--muted);font-size:.75rem}
.boss{border:2px solid var(--hot);border-radius:14px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.boss.down{border-color:var(--good)}
.bosstop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bosstop .mono{color:var(--hot);font-weight:700}.boss.down .bosstop .mono{color:var(--good)}
.hp{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.hp i{display:block;height:100%;background:var(--hot);transition:width .4s}
.boss .btn{justify-self:start}
@media (max-width:460px){.lvname{font-size:.62rem}.lvdot{width:30px;height:30px}}
@media (max-width:460px){.stat b{font-size:1.05rem}h1{font-size:1.45rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">micro1 · Turing · Crossover · Arc</div>
      <h1>Vetting Sprint</h1>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <div class="seg" id="themeSeg" role="group" aria-label="Theme">
        <button data-theme-set="auto">Auto</button><button data-theme-set="light">Light</button><button data-theme-set="dark">Dark</button>
      </div>
      <div class="sync" id="sync">Saved on this device</div>
    </div>
  </header>

  <div class="score">
    <div class="stats">
      <div class="stat"><b id="sDay">—</b><span id="sDayLbl">baseline</span></div>
      <div class="stat"><b><span id="sStreak">0</span><svg id="flame" class="flame" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.6 1.2-4 2.4-5.2.2 1.7 1 2.7 2 3.2C11 8 11.2 5 12 2z"/></svg></b><span>day streak</span></div>
      <button class="stat rankbtn" id="rankBtn" aria-label="Open trophy room"><b id="sXp">0</b><span id="sLvl">Intern</span><i class="rankbar"><i id="rankFill"></i></i></button>
      <div class="stat"><b id="sProb">0/40</b><span>problems</span></div>
    </div>
    <div class="bar" aria-hidden="true"><i id="pbar" style="width:0%"></i></div>
    <nav class="lvmap" id="lvmap" aria-label="Levels"></nav>
  </div>
  <main id="main" class="view"></main>
  <details class="foot"><summary>Settings</summary>
    <div class="zcard" style="margin-top:10px">
      <div><div class="eyebrow">Zara · Anthropic API key</div><div class="mono" id="keyState" style="font-size:.85rem">Not set</div></div>
      <div class="settings"><input id="keyIn2" type="password" placeholder="Paste a new key (empty removes it)" autocomplete="off" style="flex:1;min-width:0"><button class="btn" id="keyEdit">Save</button></div>
      <div class="settings"><label for="modelIn" style="font-size:.85rem">Model</label><input id="modelIn" style="flex:1;min-width:0"></div>

}

document.addEventListener("click",async e=>{
  const lv=e.target.closest("[data-level]");
  if(lv){const L=+lv.dataset.level;if(levelState(L)==="locked"){toast(`Finish ${LEVELS_UI[L-1][0]} to unlock ${LEVELS_UI[L][0]}`);return}if(Z.active&&L!==0){toast("End the Zara session first");return}selLevel=L;selDay=null;renderMain();return}
  const dp=e.target.closest("[data-day]");
  if(dp){const d=+dp.dataset.day;if(!dayUnlocked(d)){toast(`Finish Day ${d-1} to unlock Day ${d}`);return}selDay=d;renderMain();return}
  if(e.target.closest("[data-startweek]")){selLevel=1;selDay=1;renderMain();window.scrollTo({top:0});return}
  const blk=e.target.closest("[data-blk]");
  if(blk){const k=blk.dataset.blk,d=+k.split("-")[0];const was=curLevel();S.blocks[k]=!S.blocks[k];
    if(S.blocks[k]){markActive();if(dayDone(d)===3){if(d<30){toast(`Day ${d} complete · Day ${d+1} unlocked`);}else toast("Sprint complete")}}
    save();if(dayDone(d)===3&&d<30&&curDay()===d+1)selDay=d+1;if(curLevel()!==was&&S.blocks[k]){selLevel=curLevel();selDay=null;toast(`${LEVELS_UI[selLevel][0]} unlocked`)}
    renderAll();if(selDay!==d)window.scrollTo({top:0});return}
  const ps=e.target.closest(".seg[data-prob] button");
  if(ps){const name=ps.parentElement.dataset.prob,s=ps.dataset.s,cur=S.probs[name]||{s:"none",r:0};
    if(s==="rev"){cur.r=(cur.r||0)+1;toast("Re-solve logged · +5 XP")}
    else if(cur.s===s){cur.s="none";cur.d=null;cur.r=0}
    else{if(cur.s==="none"||!cur.d)cur.d=todayIso();cur.s=s}
    S.probs[name]=cur;markActive();save();renderAll();return}
  const ck=e.target.closest(".seg[data-chk] button");
  if(ck){const k=ck.parentElement.dataset.chk,v=+ck.dataset.v;if(S.check[k]===v)delete S.check[k];else S.check[k]=v;save();renderAll();return}
  const gt=e.target.closest("[data-gate]");
  if(gt){const d=gt.dataset.gate;S.gates[d]=!S.gates[d];if(S.gates[d]){markActive();toast("Gate cleared · +50 XP")}save();renderAll();return}
  const cp=e.target.closest("[data-copy]");
  if(cp){const txt=PROMPTS[+cp.dataset.copy][1];
    try{await navigator.clipboard.writeText(txt);toast("Copied")}
    catch(err){const src=$(cp.dataset.src);if(src){const r=document.createRange();r.selectNodeContents(src);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}toast("Selected. Copy it manually")}
  }
});
$("rankBtn").onclick=()=>{renderTrophies();$("trophies").hidden=false};
document.addEventListener("click",e=>{const c=e.target.closest("[data-close]");if(c){$(c.dataset.close).hidden=true;return}if(e.target.classList.contains("overlay"))e.target.hidden=true});
addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".overlay").forEach(o=>o.hidden=true)});
$("resetBtn").onclick=()=>{$("resetAsk").hidden=false};
$("resetNo").onclick=()=>{$("resetAsk").hidden=true};
$("resetYes").onclick=()=>{S=blank();snap=null;save();selLevel=null;selDay=null;$("resetAsk").hidden=true;renderAll();toast("Progress reset")};

/* ---------- Theme ---------- */
function applyTheme(t){
  if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  document.querySelectorAll("[data-theme-set]").forEach(b=>{const on=b.dataset.themeSet===(t||"auto");b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
}
let theme="auto";try{theme=localStorage.getItem(LS+"-theme")||"auto"}catch(e){}
applyTheme(theme);
$("themeSeg").addEventListener("click",e=>{const b=e.target.closest("[data-theme-set]");if(!b)return;theme=b.dataset.themeSet;try{localStorage.setItem(LS+"-theme",theme)}catch(e){}applyTheme(theme)});

/* ---------- Settings: key, model, backup ---------- */
function renderKeySettings(){
  const k=getKey();
  $("keyState").textContent=k?"Saved ("+k.slice(0,10)+"…)":"Not set";
  $("modelIn").value=getModel();
}
$("keyEdit").onclick=()=>{const v=$("keyIn2").value.trim();try{if(v)localStorage.setItem(KEY_LS,v);else localStorage.removeItem(KEY_LS)}catch(e){}$("keyIn2").value="";sampleFn=makeSample();renderKeySettings();renderCheck();toast(v?"Key saved":"Key removed")};
$("modelIn").onchange=e=>{try{localStorage.setItem(MODEL_LS,e.target.value.trim()||"claude-sonnet-5-5")}catch(_){}toast("Model saved")};
$("exportBtn").onclick=async()=>{
  const txt=JSON.stringify(S);
  try{const blob=new Blob([txt],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="vetting-sprint-backup-"+todayIso()+".json";document.body.appendChild(a);a.click();a.remove();toast("Backup saved")}catch(e){}
  try{await navigator.clipboard.writeText(txt)}catch(e){}
};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const obj=JSON.parse(await f.text());if(!obj||typeof obj!=="object"||!obj.blocks)throw 0;S=Object.assign(blank(),obj);save();selLevel=null;selDay=null;renderAll();toast("Progress restored")}
  catch(_){toast("That file isn't a Vetting Sprint backup")}
  e.target.value="";
};

/* ---------- Boot ---------- */
sampleFn=makeSample();
renderKeySettings();
renderAll();
setSync(navigator.onLine?"Saved on this phone":"Offline · saved on this phone");
addEventListener("online",()=>setSync("Saved on this phone"));
addEventListener("offline",()=>setSync("Offline · saved on this phone"));
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
